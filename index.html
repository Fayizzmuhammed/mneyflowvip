<style>
  :root{
    --bg:#0E1013;
    --panel:#15181C;
    --text:#F2F1ED;
    --muted:#8A8F98;
    --accent:#5B8CFF;
    --accent-dim:#3A4C7A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    overflow:hidden;
    position:relative;
  }
  .bg-glow{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .bg-glow::before,
  .bg-glow::after{
    content:"";
    position:absolute;
    width:60vmax;
    height:60vmax;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.22;
  }
  .bg-glow::before{
    background:var(--accent);
    top:-20%;
    left:-15%;
    animation:drift1 18s ease-in-out infinite;
  }
  .bg-glow::after{
    background:#7A5BFF;
    bottom:-25%;
    right:-15%;
    animation:drift2 22s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(6%,8%) scale(1.15); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-8%,-6%) scale(1.1); }
  }
  .card{
    width:100%;
    max-width:420px;
    text-align:center;
    position:relative;
    z-index:1;
  }
  .mark-wrap{
    position:relative;
    width:140px;
    height:140px;
    margin:0 auto 28px;
  }
  .mark-wrap::before{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), #7A5BFF, var(--accent));
    opacity:0.5;
    filter:blur(14px);
    animation:spin 6s linear infinite;
  }
  .mark-wrap::after{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:1.5px solid rgba(91,140,255,0.4);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:0.6; }
    50%{ transform:scale(1.08); opacity:0.15; }
  }
  .mark{
    position:relative;
    z-index:1;
    width:140px;
    height:140px;
    border-radius:50%;
    overflow:hidden;
  }
  .mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  h1{
    font-size:1.6rem;
    font-weight:600;
    line-height:1.3;
    letter-spacing:-0.01em;
    margin-bottom:12px;
  }
  p.sub{
    color:var(--muted);
    font-size:0.95rem;
    line-height:1.5;
    max-width:320px;
    margin:0 auto 32px;
  }
  a.cta{
    display:inline-block;
    width:100%;
    max-width:280px;
    background:var(--accent);
    color:#08090B;
    font-weight:600;
    font-size:0.95rem;
    padding:14px 24px;
    border-radius:10px;
    text-decoration:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  a.cta:hover{opacity:0.88;}
  a.cta:active{transform:scale(0.98);}
  .foot{
    margin-top:20px;
    color:var(--muted);
    font-size:0.78rem;
  }
</style>

  }

    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:1.5px solid rgba(91,140,255,0.4);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:0.6; }
    50%{ transform:scale(1.08); opacity:0.15; }
  }
  .mark{
    position:relative;
    z-index:1;
    width:140px;
    height:140px;
    border-radius:50%;
    overflow:hidden;
  }
  .mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  h1{
    font-size:1.6rem;
    font-weight:600;
    line-height:1.3;
    letter-spacing:-0.01em;
    margin-bottom:12px;
  }
  p.sub{
    color:var(--muted);
    font-size:0.95rem;
    line-height:1.5;
    max-width:320px;
    margin:0 auto 32px;
  }
  a.cta{
    display:inline-block;
    width:100%;
    max-width:280px;
    background:var(--accent);
    color:#08090B;
    font-weight:600;
    font-size:0.95rem;
    padding:14px 24px;
    border-radius:10px;
    text-decoration:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  a.cta:hover{opacity:0.88;}
  a.cta:active{transform:scale(0.98);}
  .foot{
    margin-top:20px;
    color:var(--muted);
    font-size:0.78rem;
  }
</style>
